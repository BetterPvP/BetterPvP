host = "0.0.0.0"
port = 8085
reservation_ttl_seconds = 10
minimum_regular_join_interval_millis = 0
boost_interval_seconds = 30
boost_amount = 5
default_rank = "PLAYER"

[[managed_targets]]
pattern = "(?i)^clans-([0-9]+)$"
target_type = "CLANS"
server_name_template = "Clans-$1"

[[managed_targets]]
pattern = "(?i)^champions$"
target_type = "CHAMPIONS"
server_name_template = "Champions"

[ranks.PLAYER]
priority = 0
bypass = false

[ranks.YOUTUBE]
priority = 25
bypass = true

[ranks.HELPER]
priority = 50
bypass = true

[ranks.TRIAL_MOD]
priority = 75
bypass = true

[ranks.MODERATOR]
priority = 100
bypass = true

[ranks.ADMIN]
priority = 150
bypass = true

[ranks.DEVELOPER]
priority = 200
bypass = true

# Placement decides which server hosts each camp and instance.
[placement]
enabled = true
nats_url = "nats://nats:4222"
nats_token = ""
prefix = "bpvp"
replicas = 1
lease_ttl_seconds = 60
default_role = "camp"
kubernetes_url = "https://kubernetes.default.svc"
namespace = ""

# The role each site runs on. Sites not listed run on default_role.
[placement.sites]
camp = "camp"

# The Agones fleet and counter behind each role
[placement.fleets.camp]
fleet = "camp"
counter = "camp-slots"
